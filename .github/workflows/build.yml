name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip App Folder
      run: unzip app.zip
    - name: Create Root Gradle Files
      run: |
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "include ':app'" >> settings.gradle
        echo "plugins { id 'com.android.application' version '8.9.0' apply false }" > build.gradle
        echo "android.useAndroidX=true" > gradle.properties
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Build with Gradle
      run: gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BanglaQRStudio-APK
        path: app/build/outputs/apk/debug/app-debug.apk
